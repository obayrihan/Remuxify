<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Remuxify</title></head><body>
<div id="RemuxifyConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
  <div data-role="content"><div class="content-primary">
    <h1>Remuxify</h1>
    <p>Use the existing local worker with Jellyfin administrator authentication. Conversions and validation run in the worker.</p>
    <form id="RemuxifyConfigForm">
      <div class="inputContainer"><label class="inputLabel" for="RemuxifyWorkerUrl">Local worker URL</label><input is="emby-input" id="RemuxifyWorkerUrl" type="url" required><div class="fieldDescription">Loopback HTTP(S) only. The worker remains a separate service.</div></div>
      <label class="emby-checkbox-label"><input is="emby-checkbox" id="RemuxifyEnabled" type="checkbox"><span>Enable the plugin connection</span></label>
      <button is="emby-button" class="raised button-submit" type="submit">Save connection</button>
      <button is="emby-button" class="raised" id="RemuxifyPair" type="button">Prepare local pairing file</button>
      <button is="emby-button" class="raised" id="RemuxifyOpen" type="button">Open dashboard</button>
    </form>
    <p id="RemuxifyStatus" role="status"></p>
    <iframe id="RemuxifyDashboard" title="Remuxify admin dashboard" style="width:100%;height:82vh;border:0" hidden></iframe>
  </div></div>
  <script>
  (function () {
    const page=document.querySelector('#RemuxifyConfigPage'), pluginId='79783b04-89a6-4da2-a395-1218189eb072';
    const status=page.querySelector('#RemuxifyStatus');
    function call(path, method, body) {
      return ApiClient.ajax({url:ApiClient.getUrl('Remuxify/'+path),type:method||'GET',dataType:'json',contentType:'application/json',data:body?JSON.stringify(body):undefined});
    }
    window.RemuxifyHost={
      request:function(path,options){
        if(path==='me')return ApiClient.getCurrentUser().then(user=>({name:user.Name}));
        return ApiClient.ajax({url:ApiClient.getUrl('Remuxify/Api/'+path),type:options.method||'GET',dataType:'json',contentType:'application/json',data:options.body});
      },
      home:function(){return ApiClient.getUrl('web/');},
      expired:function(){page.querySelector('#RemuxifyDashboard').hidden=true;status.textContent='The Jellyfin session expired or administrator access was revoked. Sign in to Jellyfin again.';}
    };
    page.addEventListener('pageshow',function(){
      ApiClient.getPluginConfiguration(pluginId).then(config=>{
        page.querySelector('#RemuxifyWorkerUrl').value=config.WorkerUrl;
        page.querySelector('#RemuxifyEnabled').checked=config.Enabled;
      }).catch(()=>{status.textContent='Could not load the administrator configuration.';});
    });
    page.querySelector('#RemuxifyConfigForm').addEventListener('submit',function(event){
      event.preventDefault();
      ApiClient.getPluginConfiguration(pluginId).then(config=>{
        config.WorkerUrl=page.querySelector('#RemuxifyWorkerUrl').value;
        config.Enabled=page.querySelector('#RemuxifyEnabled').checked;
        return ApiClient.updatePluginConfiguration(pluginId,config);
      }).then(()=>{status.textContent='Connection saved. Pair the worker before opening the dashboard.';})
        .catch(()=>{status.textContent='Could not save the connection.';});
    });
    page.querySelector('#RemuxifyPair').addEventListener('click',function(){
      call('Pair','POST').then(result=>{status.textContent='Pairing file: '+result.secretFile+'. Configure the worker to read this local file; the secret is never sent to this browser.';})
        .catch(()=>{status.textContent='Could not prepare pairing. Check plugin data-folder permissions.';});
    });
    page.querySelector('#RemuxifyOpen').addEventListener('click',function(){
      call('Status').then(result=>{
        if(!result.enabled||!result.paired)throw new Error('not paired');
        const frame=page.querySelector('#RemuxifyDashboard'); frame.src=ApiClient.getUrl('Remuxify/Ui/index.html'); frame.hidden=false;
        status.textContent='Dashboard uses your current Jellyfin administrator session.';
      }).catch(()=>{status.textContent='Enable and pair the local worker first.';});
    });
  }());
  </script>
</div></body></html>
